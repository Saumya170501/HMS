<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1"/>
  <!-- Subtle grid lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
  <!-- Bar chart elements -->
  <rect x="14" y="34" width="6" height="14" rx="1.5" fill="url(#bar1)" opacity="0.8"/>
  <rect x="23" y="26" width="6" height="22" rx="1.5" fill="url(#bar2)" opacity="0.8"/>
  <rect x="32" y="30" width="6" height="18" rx="1.5" fill="url(#bar1)" opacity="0.8"/>
  <rect x="41" y="22" width="6" height="26" rx="1.5" fill="url(#bar2)" opacity="0.8"/>
  <!-- Trend line -->
  <polyline points="17,30 26,22 35,26 44,16" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Glow dot at end -->
  <circle cx="44" cy="16" r="3" fill="#06b6d4" opacity="0.3"/>
  <circle cx="44" cy="16" r="1.5" fill="#06b6d4"/>
</svg>
